# Loaded into the http{} context via /etc/nginx/conf.d/ (all *.conf in
# conf.d is included by nginx's default main nginx.conf automatically)

limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=ws_zone:10m    rate=5r/s;

limit_req_status 429;
