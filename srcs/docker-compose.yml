services:
  nginx:
    build:
      context: ./requirements/nginx
    container_name: nginx
    env_file: .env
    ports:
      - "${NGINX_HTTPS_PORT}:443"
      - "${NGINX_HTTP_PORT}:80"
    depends_on:
      - frontend
      - backend
    init: true
    volumes:
      - avatars_data:/var/www/avatars:ro
    networks:
      - app_net
    restart: unless-stopped

  frontend:
    build:
      context: ./requirements/frontend
      args:
        VITE_API_URL_V1: ${VITE_API_URL_V1}
    container_name: frontend
    env_file: .env
    expose:
      - "${FRONTEND_PORT}"
    networks:
      - app_net
    restart: unless-stopped

  backend:
    build:
      context: ./requirements/backend
    container_name: backend
    env_file: .env
    expose:
      - "${BACKEND_PORT}"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - avatars_data:/app/avatars
    networks:
      - app_net
    restart: unless-stopped

  postgresql:
    build:
      context: ./requirements/postgresql
    container_name: postgresql
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/postgres
  avatars_data:
    name: avatars_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/avatars
